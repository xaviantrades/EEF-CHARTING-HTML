<!DOCTYPE html>
<!--
=====================================================================
  KILELE TRADER  -  Messages PAGE   (pages/messages/messages.html)
=====================================================================
  This is the HTML file of the "Messages" page. It has its own css
  (messages.css) and its own javascript (messages.js), all in this folder.

  WHAT THIS PAGE DOES
    The mailbox: an empty state with "Register" and "Sign in" buttons that both
    lead to the Login page. This page has NO live data, so its content is plain
    HTML written directly below (no render() function needed).

  FILE ORDER  (the browser loads things top to bottom)
    <head>  theme-boot.js   -> sets light/dark BEFORE the first paint (no flash)
            base.css        -> shared colours, shell, buttons, sheets
            messages.css -> only this page
    <body>  the app shell   -> header / main / nav / drawer / overlay / toast
            core.js         -> shared data, icons, price feed, session saving
            shell.js        -> shared actions, header, nav, navigation
            messages.js -> only this page: its description, actions and start

  The scripts are normal (non-module) scripts on purpose, so this page
  also works when opened by double-clicking the file (file://).
=====================================================================
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the app use the full screen on notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- colours the phone's browser bar. core.js updates it when the theme changes -->
  <meta name="theme-color" content="#000000">
  <title>Messages - Kilele Trader</title> <!-- EDIT: brand name -->

  <!-- Apply the saved theme immediately (runs before the page is painted) -->
  <script src="../../shared/theme-boot.js"></script>

  <!-- Fonts: Roboto (body) + Roboto Condensed (titles and numbers). Needs internet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- 1) Shared styles (theme colours, app shell, buttons, drawer, sheets) -->
  <link rel="stylesheet" href="../../shared/base.css">
  <!-- 2) Styles used ONLY by this page -->
  <link rel="stylesheet" href="messages.css">
</head>

<body>
  <!-- #app is the phone-shaped column. The same 6 empty boxes exist in every page;
       shell.js / core.js fill them in. -->
  <div id="app">
    <header id="hdr"></header>   <!-- top bar: filled by renderHeader() using this page's header() -->
    <main id="main">
      <!-- Static content. Layout: a tall column; the empty-state fills the space and the buttons sit at the bottom. -->
      <div class="msg-page">
        <div class="empty msg-empty">
          <div class="msg-icon"><i data-icon="chat" data-size="130" data-stroke="1.2"></i></div>
          <p class="muted msg-text">No messages</p>
        </div>
        <div class="msg-actions">
          <!-- data-action="go" + data-to="login"  ->  Actions.go() in shell.js opens the login page -->
          <button class="btn msg-register" data-action="go" data-to="login">Register</button>
          <button class="btn sec msg-signin" data-action="go" data-to="login">Sign in</button>
        </div>
      </div>
    </main>
    <nav id="nav"></nav>         <!-- bottom tabs: filled by renderNav() -->
    <div id="drawer"></div>      <!-- side menu: filled by Drawer.open() -->
    <div id="overlay"></div>     <!-- bottom sheets + dialogs: filled by UI.sheet() / UI.modal() -->
    <div id="toast" role="status"></div> <!-- small message pill: UI.toast() -->
  </div>

  <!-- Scripts: ORDER MATTERS. Each one uses things defined by the one before it. -->
  <script src="../../shared/core.js"></script>
  <script src="../../shared/shell.js"></script>
  <script src="messages.js"></script>
</body>
</html>
